[project]
name = "ekitirun-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "segno>=1.6",
  "jinja2>=3.1",
  "weasyprint>=62",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear, ruff-specific
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app"]
