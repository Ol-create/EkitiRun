[alembic]
script_location = alembic
# Lets env.py import the `app` package.
prepend_sys_path = .
# e.g. 2026_10_15_1200-3f2a9c_create_core_tables.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# The database URL comes from DATABASE_URL (app/core/config.py), not from here.
# After generating a migration, run `uv run ruff format alembic` so CI passes.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
