services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ekitirun
      POSTGRES_PASSWORD: ekitirun
      POSTGRES_DB: ekitirun
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ./apps/api/.env
    ports: ["8000:8000"]
    volumes: ["./apps/api:/code"]
    depends_on: [db, redis]

  worker:
    build: ./apps/api
    command: arq app.workers.settings.WorkerSettings
    env_file: ./apps/api/.env
    volumes: ["./apps/api:/code"]
    depends_on: [db, redis]

volumes:
  db-data:
